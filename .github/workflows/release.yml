name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish self-contained executable
      run: |
        dotnet publish src/ForceDeleter/ForceDeleter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/

    - name: Create zip archive and checksums
      shell: pwsh
      run: |
        Compress-Archive -Path artifacts/ForceDeleter.exe -DestinationPath artifacts/ForceDeleter-win-x64.zip -Force
        $hash = (Get-FileHash artifacts/ForceDeleter.exe -Algorithm SHA256).Hash
        "$hash  ForceDeleter.exe" | Out-File -Encoding utf8 artifacts/SHA256SUMS.txt
        $zipHash = (Get-FileHash artifacts/ForceDeleter-win-x64.zip -Algorithm SHA256).Hash
        "$zipHash  ForceDeleter-win-x64.zip" | Out-File -Append -Encoding utf8 artifacts/SHA256SUMS.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        name: ForceDeleter ${{ github.event.inputs.tag || github.ref_name }}
        draft: false
        prerelease: false
        files: |
          artifacts/ForceDeleter.exe
          artifacts/ForceDeleter-win-x64.zip
          artifacts/SHA256SUMS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
