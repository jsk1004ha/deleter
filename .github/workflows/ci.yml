name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ForceDeleter.sln

    - name: Build solution
      run: dotnet build ForceDeleter.sln -c Release --no-restore -warnaserror

    - name: Run deletion engine regressions
      run: |
        dotnet build tests/engine/ForceDeleter.EngineTests.csproj -c Release -warnaserror
        dotnet run --project tests/engine/ForceDeleter.EngineTests.csproj -c Release --no-build
